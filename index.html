  return {
    version: VERSION, tp: 0,

    bestWave: { M1: 0, M2: 0, M3: 0 },
    totalKills: 0,
    settings: { reducedMotion: 0, colorblind: 'off', uiScale: 1 }
  };
}
function num(v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; }
function bool(v) { return v === true || v === 1 ? 1 : 0; }
function loadSave() {
  var raw = null;
  try { raw = window.localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) { save = defaultSave(); return; }
  var o = null;
  try { o = JSON.parse(raw); } catch (e) { o = null; }

    save = defaultSave();
    saveWarn = '存档已损坏，已重置为初始态。';
    try { window.localStorage.removeItem(SAVE_KEY); } catch (e2) {}
    return;
  }
  var d = defaultSave();
  var out = defaultSave();
  out.version = VERSION;
  out.tp = Math.max(0, Math.floor(num(o.tp, 0)));
  out.totalKills = Math.max(0, Math.floor(num(o.totalKills, 0)));
  var i, k;
  for (i = 0; i < TECH_IDS.length; i++) { k = TECH_IDS[i]; out.tech[k] = bool(o.tech && o.tech[k]); }

    k = MAP_IDS[i];
    out.firstClear[k] = bool(o.firstClear && o.firstClear[k]);
    out.bestWave[k] = Math.max(0, Math.min(12, Math.floor(num(o.bestWave && o.bestWave[k], 0))));
  }
  var st = o.settings || {};
  out.settings.reducedMotion = bool(st.reducedMotion);
  out.settings.colorblind = (st.colorblind === 'deuter' || st.colorblind === 'trit') ? st.colorblind : 'off';
  out.settings.uiScale = (st.uiScale === 1.25 || st.uiScale === 1.5) ? st.uiScale : 1;
  out.version = num(o.version, VERSION) === VERSION ? VERSION : VERSION;
  save = out;
  void d;
}
function writeSave() {
  try { window.localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function resetSave() {

/* palette 色值 → rgba 字符串（供 pattern / 低透明度填充使用） */
function rgba(hex, a) {
  var h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
  if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
  var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}
function fxDur(ms) { return UI.reducedMotion ? Math.min(ms, 120) : ms; }
function fxCount(n) { return UI.reducedMotion ? Math.min(n, 3) : n; }
function shakeMag() { return UI.reducedMotion ? 0 : 1; }
/* UI 缩放只作用于 HUD 字号 */

function resize() {
  var w = window.innerWidth || document.documentElement.clientWidth || LW;
  var h = window.innerHeight || document.documentElement.clientHeight || LH;
  var dpr = window.devicePixelRatio || 1;
  if (dpr > 2.5) dpr = 2.5;                    // 防止超高 DPR 下填充率爆炸
  VIEW.dpr = dpr; VIEW.w = w; VIEW.h = h;
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var s = Math.min(w / LW, h / LH);
  VIEW.scale = s;
  VIEW.ox = (w - LW * s) / 2;
  VIEW.oy = (h - LH * s) / 2;
  bgDirty = true;
}
window.addEventListener('resize', function () { resize(); });
window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

/* 屏幕坐标 → 逻辑坐标 */
function toLogic(clientX, clientY) {
  var r = canvas.getBoundingClientRect();
  return {
    x: (clientX - r.left - VIEW.ox) / VIEW.scale,
    y: (clientY - r.top - VIEW.oy) / VIEW.scale
  };
}

/* ============================================================== 11. 绘制基元 */
function fillRect(x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }
function strokeRect(x, y, w, h, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(w), Math.round(h));
}
function line(x1, y1, x2, y2, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circle(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function ring(x, y, r, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
}
function arcRing(x, y, r, a0, a1, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1;
  ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke();
}
/* 正多边形顶点（sides=4 → 正方形，尖端朝上由 rot 控制） */
function polyPath(cx, cy, r, sides, rot) {
  var i, a;
  ctx.beginPath();
  for (i = 0; i < sides; i++) {
    a = rot + i * TAU / sides;
    if (i === 0) ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    else ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  ctx.closePath();
}
/* 双层辉光：外圈 α0.15 + 'lighter'，禁止 shadowBlur（art-bible §4.4.5） */
function glowCircle(x, y, r, col, alpha) {
  var g = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = (alpha === undefined ? 0.15 : alpha);
  circle(x, y, r * 1.6, col);
  ctx.globalAlpha = 1;
  circle(x, y, r, col);
  ctx.globalAlpha = g;
  ctx.globalCompositeOperation = 'source-over';
}
function text(str, x, y, size, col, align, weight, mono) {
  ctx.font = (weight || 400) + ' ' + fs(size) + 'px ' + (mono ? MONO : FONT);
  ctx.fillStyle = col;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(str, x, y);
}
function textW(str, size, weight, mono) {
  ctx.font = (weight || 400) + ' ' + fs(size) + 'px ' + (mono ? MONO : FONT);
  return ctx.measureText(str).width;
}
function roundRectPath(x, y, w, h, r) {
  var rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y); ctx.arcTo(x + w, y, x + w, y + rr, rr);
  ctx.lineTo(x + w, y + h - rr); ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
  ctx.lineTo(x + rr, y + h); ctx.arcTo(x, y + h, x, y + h - rr, rr);
  ctx.lineTo(x, y + rr); ctx.arcTo(x, y, x + rr, y, rr);
  ctx.closePath();
}
function dashCircle(x, y, r, col, lw, dash) {
  ctx.save();
  ctx.setLineDash(dash || [4, 4]);
  ring(x, y, r, col, lw || 1);
  ctx.restore();
}
/* 焦点环：3px 强调色 + 四角直角括号（与悬停同规格，art-bible A7） */
function focusBrackets(x, y, w, h, col) {
  var L = 8;
  strokeRect(x - 1, y - 1, w + 2, h + 2, col, 3);
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 5, y - 5 + L); ctx.lineTo(x - 5, y - 5); ctx.lineTo(x - 5 + L, y - 5);
  ctx.moveTo(x + w + 5 - L, y - 5); ctx.lineTo(x + w + 5, y - 5); ctx.lineTo(x + w + 5, y - 5 + L);
  ctx.moveTo(x + w + 5, y + h + 5 - L); ctx.lineTo(x + w + 5, y + h + 5); ctx.lineTo(x + w + 5 - L, y + h + 5);
  ctx.moveTo(x - 5 + L, y + h + 5); ctx.lineTo(x - 5, y + h + 5); ctx.lineTo(x - 5, y + h + 5 - L);
  ctx.stroke();
}
/* 禁用符：中央斜十字（不依赖颜色，art-bible §3.4） */
function disabledCross(cx, cy, r, col) {
  var s = r * 0.52;
  ctx.strokeStyle = col; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(cx - s, cy - s); ctx.lineTo(cx + s, cy + s);
  ctx.moveTo(cx + s, cy - s); ctx.lineTo(cx - s, cy + s);
  ctx.stroke();
}

/* 斜纹图案（盲区警示）——一次性预建，运行期复用 */
var hatchPattern = null;
function buildHatch() {
  var pc = document.createElement('canvas');
  pc.width = 14; pc.height = 14;
  var p = pc.getContext('2d');
  p.clearRect(0, 0, 14, 14);
  p.strokeStyle = rgba(TH.warn, 0.50);       // α 不得低于 0.50（对路面 3.36:1 的唯一达标值）
  p.lineWidth = 4;
  p.beginPath();
  p.moveTo(-4, 18); p.lineTo(18, -4);
  p.stroke();
  hatchPattern = ctx.createPattern(pc, 'repeat');
}

/* ============================================================= 12. 音频合成 */
var AUD = { ac: null, master: null, voices: 0, muted: false };
function initAudio() {
  if (AUD.ac) { if (AUD.ac.state === 'suspended') { try { AUD.ac.resume(); } catch (e) {} } return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    AUD.ac = new AC();
    AUD.master = AUD.ac.createGain();
    AUD.master.gain.value = 0.16;
    AUD.master.connect(AUD.ac.destination);
  } catch (e) { AUD.ac = null; }
}
function tone(freq, durMs, type, vol, slideTo, delayMs) {
  if (!AUD.ac || AUD.muted) return;
  if (AUD.voices > 18) return;                  // 并发限制，避免 CPU 抖动
  var t0 = AUD.ac.currentTime + (delayMs || 0) / 1000;
  var d = Math.max(0.03, durMs / 1000);
  var o = AUD.ac.createOscillator();
  var g = AUD.ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + d);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, vol || 0.2), t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g); g.connect(AUD.master);
  AUD.voices++;
  o.onended = function () { AUD.voices--; try { o.disconnect(); g.disconnect(); } catch (e) {} };
  o.start(t0); o.stop(t0 + d + 0.02);
}
function sfx(name) {
  switch (name) {
    case 'shootA': tone(680, 60, 'square', 0.10, 420); break;
    case 'shootB': tone(150, 130, 'sawtooth', 0.14, 70); break;
    case 'shootD': tone(980, 120, 'triangle', 0.13, 300); break;
    case 'hit': tone(320, 45, 'square', 0.05, 240); break;
    case 'kill': tone(520, 90, 'triangle', 0.09, 880); break;
    case 'leak': tone(180, 420, 'sawtooth', 0.20, 60); break;
    case 'wave': tone(440, 160, 'triangle', 0.12, 660); break;
    case 'boss': tone(90, 900, 'sawtooth', 0.18, 55); break;
    case 'summon': tone(240, 220, 'sawtooth', 0.14, 520); break;   // A6：Boss 召唤的音效等价物
    case 'build': tone(300, 90, 'square', 0.12, 520); break;
    case 'upgrade': tone(520, 80, 'triangle', 0.12, 780); tone(780, 110, 'triangle', 0.10, 1040, 70); break;
    case 'sell': tone(420, 90, 'square', 0.10, 220); break;
    case 'error': tone(140, 110, 'square', 0.10, 110); break;
    case 'tech': tone(560, 90, 'triangle', 0.13, 840); tone(840, 140, 'triangle', 0.11, 1120, 80); break;
    case 'click': tone(760, 40, 'square', 0.07, 900); break;
    case 'lose': tone(220, 700, 'sawtooth', 0.18, 70); break;
    case 'win': tone(520, 160, 'triangle', 0.14, 780); tone(660, 160, 'triangle', 0.13, 990, 150); tone(880, 300, 'triangle', 0.13, 1320, 300); break;
  }
}

/* ========================================================== 13. 粒子对象池 */
var PMAX = 800;
var particles = new Array(PMAX);
var pCursor = 0, pAlive = 0;
(function initParticles() {
  for (var i = 0; i < PMAX; i++) {
    particles[i] = { alive: false, x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, color: C.white, grav: 0, kind: 0 };
  }
})();
function pSpawn(x, y, vx, vy, lifeMs, size, color, kind) {
  if (pAlive >= 600) {                       // 硬上限 600，最旧优先淘汰
    var j, dropped = 0;
    for (j = 0; j < PMAX && dropped < 1; j++) {
      if (particles[j].alive) { particles[j].alive = false; dropped++; pAlive--; }
    }
  }
  var p = null, i;
  for (i = 0; i < PMAX; i++) {
    var idx = (pCursor + i) % PMAX;
    if (!particles[idx].alive) { p = particles[idx]; pCursor = (idx + 1) % PMAX; break; }
  }
  if (!p) return;
  p.alive = true; p.x = x; p.y = y; p.vx = vx; p.vy = vy;
  p.life = fxDur(lifeMs); p.max = p.life; p.size = size; p.color = color;
  p.kind = kind || 0; p.grav = 0;
  pAlive++;
}
function pBurst(x, y, n, color, speed, size, lifeMs) {
  var count = fxCount(n), i, a, sp;
  for (i = 0; i < count; i++) {
    a = Math.random() * TAU;
    sp = speed * (0.35 + Math.random() * 0.75);
    pSpawn(x, y, Math.cos(a) * sp, Math.sin(a) * sp, lifeMs * (0.6 + Math.random() * 0.6), size, color, 0);
  }
}
function pUpdate(dtMs) {
  var i, p;
  for (i = 0; i < PMAX; i++) {
    p = particles[i];
    if (!p.alive) continue;
    p.life -= dtMs;
    if (p.life <= 0) { p.alive = false; pAlive--; continue; }
    p.x += p.vx * dtMs / 1000;
    p.y += p.vy * dtMs / 1000;
    p.vx *= 0.965; p.vy *= 0.965;
  }
}
function pDraw() {
  var i, p, a;
  for (i = 0; i < PMAX; i++) {
    p = particles[i];
    if (!p.alive) continue;
    a = p.life / p.max;
    ctx.globalAlpha = a < 0 ? 0 : a;
    if (p.kind === 0) {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    } else {
      circle(p.x, p.y, p.size * (0.35 + 0.65 * a), p.color);
    }
  }
  ctx.globalAlpha = 1;
}

/* ======================================================== 14. 路径几何工具 */
function pathMetrics(pts) {
  var cum = [0], i, t = 0;
  for (i = 1; i < pts.length; i++) { t += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(t); }
  return { pts: pts, cum: cum, total: t };
}
function pathPoint(pm, dist) {
  var pts = pm.pts, cum = pm.cum, i;
  if (dist <= 0) return { x: pts[0][0], y: pts[0][1], a: Math.atan2(pts[1][1] - pts[0][1], pts[1][0] - pts[0][0]) };
  if (dist >= pm.total) {
    var n = pts.length - 1;
    return { x: pts[n][0], y: pts[n][1], a: Math.atan2(pts[n][1] - pts[n - 1][1], pts[n][0] - pts[n - 1][0]) };
  }
  for (i = 1; i < cum.length; i++) {
    if (dist <= cum[i]) {
      var seg = cum[i] - cum[i - 1];
      var t2 = seg > 0 ? (dist - cum[i - 1]) / seg : 0;
      return {
        x: pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t2,
        y: pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t2,
        a: Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0])
      };
    }
  }
  var m = pts.length - 1;
  return { x: pts[m][0], y: pts[m][1], a: 0 };
}

/* ============================================================ 15. 地图构建 */
function cellCenter(gx, gy) { return { x: GRID_OX + gx * CELL + CELL / 2, y: GRID_OY + gy * CELL + CELL / 2 }; }

function buildMap(mapId) {
  var def = MAPS[mapId];
  var m = {
    id: def.id, name: def.name, sub: def.sub, def: def,
    lanes: [], base: { x: def.base[0], y: def.base[1] },
    sites: [], blind: [], blindDecl: [],
    k: def.k, baseHPMax: 0
  };
  var i, j;
  for (i = 0; i < def.paths.length; i++) m.lanes.push(pathMetrics(def.paths[i]));

  /* 点位 */
  for (i = 0; i < def.pts.length; i++) {
    var p = def.pts[i];
    var c = cellCenter(p[0], p[1]);
    var kind = p.length > 2 ? p[2] : 0;
    var high = p.length > 3 ? p[3] : 0;
    m.sites.push({
      idx: i, gx: p[0], gy: p[1], x: c.x, y: c.y,
      kind: kind, high: high, tower: null,
      maxRng: high ? 185 * 1.15 : 185      // 该点位「理论最大射程」→ 判定盲区
    });
  }
  /* 盲区求解：以点位最大射程对所有地面路径采样，取不可覆盖的连续段 */
  var blind = [];
  for (i = 0; i < m.lanes.length; i++) {
    var pm = m.lanes[i], step = 4, d, runs = [], cur = null;
    for (d = 0; d <= pm.total; d += step) {
      var pp = pathPoint(pm, d), covered = false;
      for (j = 0; j < m.sites.length; j++) {
        var s = m.sites[j];
        if (Math.hypot(pp.x - s.x, pp.y - s.y) <= s.maxRng) { covered = true; break; }
      }
      if (!covered) {
        if (cur && d - cur.e <= step * 1.5) cur.e = d;
        else { cur = { s: d, e: d, lane: i }; runs.push(cur); }
      }
    }
    for (j = 0; j < runs.length; j++) if (runs[j].e - runs[j].s > 24) blind.push(runs[j]);
  }
  m.blind = blind;
  if (def.blindDecl) {
    for (i = 0; i < def.blindDecl.length; i++) {
      m.blindDecl.push({ a: { x: def.blindDecl[i][0][0], y: def.blindDecl[i][0][1] }, b: { x: def.blindDecl[i][1][0], y: def.blindDecl[i][1][1] } });
    }
  }
  return m;
}

/* 点位是否被覆盖于某点的射程外（用于建造提示） */
function siteTowerAt(m, x, y) {
  for (var i = 0; i < m.sites.length; i++) {
    var s = m.sites[i];
    if (Math.abs(x - s.x) <= 20 && Math.abs(y - s.y) <= 20) return s;
  }
  return null;
}

/* ========================================================== 17. 伤害公式 */
/* GDD §3.1 / §4.2 唯一公式：ARM_eff=ARM×(1−PEN)；MIT=ARM_eff/(ARM_eff+50) */
function dmgCalc(dmg, arm, pen) {
  var pe = Math.min(0.95, Math.max(0, pen || 0));
  var a = Math.max(0, arm || 0);
  var armEff = Math.max(0, a * (1 - pe));
  var mit = armEff / (armEff + 50);
  var out = Math.max(1, Math.round(dmg * (1 - mit)));
  return { armEff: armEff, mit: mit, out: out };
}
function effPen(basePen) { return Math.min(0.95, (basePen || 0) + MOD.penAdd); }

/* ============================================================ 18. 敌人系统 */
var ENEMY_R = { GRUNT: 9, SPRINTER: 8, BULWARK: 8, WASP: 9, WARDEN: 12, BOSS: 24 };
var nextEid = 1;

function waveHP(baseHP, wave) { return baseHP * (1 + G.map.k * (wave - 1)); }

function spawnEnemy(type, lane, opts) {
  opts = opts || {};
  var def = ENEMIES[type];
  if (!def) return null;
  var en = {
    eid: nextEid++, type: type, def: def,
    hp: 0, maxHp: 0, spd: def.spd, baseSpd: def.spd, arm: def.arm,
    bountyBase: def.bounty, baseDmg: def.baseDmg,
    isFlying: !!def.flying, isBoss: !!def.boss,
    lane: lane || 0, prog: 0, x: 0, y: 0, a: 0,
    slowPct: 0, frost: 0, auraMul: 1, mortarSlowMs: 0, mortarSlowPct: 0,
    alive: true, dead: false, tMs: Math.random() * 1000,
    summonMarks: 0, summonPending: 0, summonTgMs: 0, ringMs: 0,
    isSummon: !!opts.isSummon, bountyZero: !!opts.bountyZero,
    flightTotal: 1, sx: 0, sy: 0, tx: 0, ty: 0,
    hitFlash: 0, healMs: 0, pulse: Math.random() * 900
  };
  if (def.boss) {
    en.maxHp = opts.hp || 1800;
  } else {
    en.maxHp = waveHP(def.hp, G.wave || 1);
  }
  en.hp = en.maxHp;

  var m = G.map;
  if (en.isFlying) {
    if (m.def.airSpawn === 'border') {
      en.sx = -10; en.sy = 160 + Math.random() * 400;      // M3：左边界 y∈[160,560]
    } else {
      var lp = m.lanes[lane] || m.lanes[0];
      en.sx = lp.pts[0][0] - 20; en.sy = lp.pts[0][1];
    }
    en.tx = m.base.x; en.ty = m.base.y;
    en.flightTotal = Math.hypot(en.tx - en.sx, en.ty - en.sy);
    en.x = en.sx; en.y = en.sy;
    en.a = Math.atan2(en.ty - en.sy, en.tx - en.sx);
  } else {
    var pm = m.lanes[lane] || m.lanes[0];
    en.prog = opts.startDist || 0;
    var pp = pathPoint(pm, en.prog);
    en.x = pp.x; en.y = pp.y; en.a = pp.a;
  }
  G.enemies.push(en);
  return en;
}

function queueSpawn(type, lane, opts) {
  G.pendingSpawn.push({ type: type, lane: lane, opts: opts || {}, delayMs: 0 });
}

function applyDamage(en, rawDmg, pen, srcTag) {
  if (!en.alive) return 0;
  var arm = Math.max(0, en.arm - en.frost);
  var r = dmgCalc(rawDmg, arm, pen);
  var d = r.out;
  if (en.auraMul < 1) d = Math.max(1, Math.round(d * en.auraMul));
  en.hp -= d;
  en.hitFlash = UI.reducedMotion ? 40 : 90;
  if (en.hp <= 0) killEnemy(en);
  else if (en.isBoss) checkBossSummon(en);
  void srcTag;
  return d;
}
function killEnemy(en) {
  if (!en.alive) return;
  en.alive = false; en.dead = true;
  if (!en.isSummon) G.kills++;          /* 召唤物不计入击杀数（GDD 附录 5） */
  var gold = en.bountyZero ? 0 : en.bountyBase;
  if (gold > 0 && MOD.bountyMul > 1) gold = Math.max(gold + 1, Math.floor(gold * MOD.bountyMul));
  if (gold > 0) G.gold += gold;
  pBurst(en.x, en.y, en.isBoss ? 12 : 6, en.def.color, en.isBoss ? 190 : 96, en.isBoss ? 4 : 3, 320);
  pBurst(en.x, en.y, en.isBoss ? 4 : 3, C.warn, 70, 2, 260);
  sfx(en.isBoss ? 'boss' : 'kill');
  if (en.isBoss) {
    shakeT = fxDur(320); G.shakeMagPx = 6 * shakeMag();
  }
}
/* 每损失 25% 最大 HP 召唤 2 只 GRUNT（赏金 0、不计击杀）。

   若在此冻结 Boss，400ms×3 = 1.2s 免费输出窗口会实质削弱它、破坏三图难度曲线。 */
function checkBossSummon(en) {
  var lostPct = 1 - en.hp / en.maxHp;
  var marks = Math.min(3, Math.floor(lostPct / 0.25));
  while (en.summonMarks < marks) {
    en.summonMarks++;
    en.summonPending += 2;
    if (en.summonTgMs <= 0) en.summonTgMs = BOSS_TG_MS;
    en.ringMs = BOSS_TG_MS;
    pBurst(en.x, en.y, fxCount(8), C.wardenAura, 130, 2, fxDur(BOSS_TG_MS));
    sfx('summon');
  }
}
function leakEnemy(en) {
  G.baseHP -= en.baseDmg;
  G.leaks[en.type] = (G.leaks[en.type] || 0) + 1;
  G.leaksTotal++;
  en.alive = false; en.dead = true;
  G.flashMs = fxDur(600); G.flashMax = G.flashMs;
  shakeT = fxDur(320); G.shakeMagPx = 8 * shakeMag();
  sfx('leak');
  if (G.baseHP <= 0) { G.baseHP = 0; endGame(false); }
}

function updateEnemies(dtMs) {
  var dt = dtMs / 1000, i, en;
  for (i = 0; i < G.enemies.length; i++) {
    en = G.enemies[i];
    if (!en.alive) continue;
    en.tMs += dtMs;
    if (en.hitFlash > 0) en.hitFlash -= dtMs;
    if (en.mortarSlowMs > 0) { en.mortarSlowMs -= dtMs; if (en.mortarSlowMs <= 0) en.mortarSlowPct = 0; }
    if (en.ringMs > 0) en.ringMs = Math.max(0, en.ringMs - dtMs);
    if (en.summonTgMs > 0) {
      en.summonTgMs -= dtMs;
      if (en.summonTgMs <= 0) {
        en.summonTgMs = 0;
        for (var sn = 0; sn < en.summonPending; sn++) {
          queueSpawn('GRUNT', en.lane, {
            startDist: Math.max(0, en.prog - 8 - sn * 14),
            isSummon: true, bountyZero: true
          });
        }
        en.summonPending = 0;
      }
    }

    var slow = en.slowPct;
    if (en.mortarSlowPct > slow) slow = en.mortarSlowPct;
    if (en.isBoss && slow > 0.60) slow = 0.60;          // Boss 免疫：最高减速到原速 40%
    var spd = en.baseSpd * (1 - slow);

    if (en.isFlying) {
      en.prog += spd * dt;
      var t = en.prog / en.flightTotal;
      en.x = en.sx + (en.tx - en.sx) * t;
      en.y = en.sy + (en.ty - en.sy) * t;
      if (t >= 1) { leakEnemy(en); continue; }
    } else {
      en.prog += spd * dt;
      var pm = G.map.lanes[en.lane] || G.map.lanes[0];
      if (en.prog >= pm.total) { leakEnemy(en); continue; }
      var pp = pathPoint(pm, en.prog);
      en.x = pp.x; en.y = pp.y; en.a = pp.a;
    }
  }
  /* 补充召唤物 */
  if (G.pendingSpawn.length) {
    var list = G.pendingSpawn;
    G.pendingSpawn = [];
    for (i = 0; i < list.length; i++) spawnEnemy(list[i].type, list[i].lane, list[i].opts);
  }
  /* 清理死亡（swap-pop，零分配） */
  for (i = G.enemies.length - 1; i >= 0; i--) {
    if (!G.enemies[i].alive) {
      var last = G.enemies[G.enemies.length - 1];
      G.enemies[i] = last;
      G.enemies.pop();
    }
  }
}

/* WARDEN 光环 + 治疗（在伤害结算前刷新，appendices §4） */
function updateWardens(dtMs) {
  var i, j, w, e, any = false;
  for (i = 0; i < G.enemies.length; i++) {
    e = G.enemies[i];
    e.auraMul = 1;
    if (e.type === 'WARDEN' && e.alive) any = true;
  }
  if (!any) return;
  for (i = 0; i < G.enemies.length; i++) {
    w = G.enemies[i];
    if (!w.alive || w.type !== 'WARDEN') continue;
    var R = w.def.auraR;
    for (j = 0; j < G.enemies.length; j++) {
      e = G.enemies[j];
      if (!e.alive || e === w) continue;
      if (Math.hypot(e.x - w.x, e.y - w.y) <= R) {
        if (w.def.auraMul < e.auraMul) e.auraMul = w.def.auraMul;
      }
    }
    /* 每 4s 治疗光环内 HP% 最低者 */
    w.healMs += dtMs;
    if (w.healMs >= w.def.healMs) {
      w.healMs = 0;
      var best = null, bestPct = 2;
      for (j = 0; j < G.enemies.length; j++) {
        e = G.enemies[j];
        if (!e.alive) continue;
        if (Math.hypot(e.x - w.x, e.y - w.y) > R) continue;
        var pct = e.hp / e.maxHp;
        if (pct < bestPct) { bestPct = pct; best = e; }
      }
      if (best && best.hp < best.maxHp) {
        best.hp = Math.min(best.maxHp, best.hp + best.maxHp * w.def.healPct);
        pBurst(best.x, best.y, 3, TH.ok, 30, 2, 260);
      }
    }
  }
}

/* ============================================================== 19. 塔系统 */
function towerRng(t) {
  var r = t.def.lv[t.lv].rng;
  return t.site.high ? r * 1.15 : r;
}
function towerDmg(t) {
  var d = t.def.lv[t.lv].dmg || 0;
  return d * MOD.dmgMul;
}
function towerPen(t) { return effPen(t.def.lv[t.lv].pen || 0); }
function towerCd(t) { return t.def.lv[t.lv].cdMs; }
function towerSlow(t) { return t.def.lv[t.lv].slow || 0; }
function towerDps(t) { return t.def.lv[t.lv].dps || 0; }
function towerSplash(t) { return (t.def.lv[t.lv].splash || 0) * MOD.splashR; }

function makeTower(site, type) {
  var def = TOWERS[type];
  return {
    tid: (makeTower._n = (makeTower._n || 0) + 1),
    type: type, def: def, site: site, lv: 0,
    cdMs: 0, angle: -Math.PI / 2, invested: def.cum[0],
    lockEid: 0, lockMs: 0, spin: 0, flash: 0, upgradeFx: 0
  };
}

function inRange(t, e) {
  if (e.isFlying && !t.def.canHitAir) return false;
  return Math.hypot(e.x - t.site.x, e.y - t.site.y) <= towerRng(t);
}
/* 选敌：射程内「最靠近基地」优先（prog 最大） */
function pickTarget(t, excludeEid) {
  var best = null, bestProg = -1, i, e;
  for (i = 0; i < G.enemies.length; i++) {
    e = G.enemies[i];
    if (!e.alive || e.eid === excludeEid) continue;
    if (e.isFlying && !t.def.canHitAir) continue;
    if (Math.hypot(e.x - t.site.x, e.y - t.site.y) > towerRng(t)) continue;
    var pr = e.isFlying ? e.prog / e.flightTotal : e.prog / (G.map.lanes[e.lane] || G.map.lanes[0]).total;
    if (pr > bestProg) { bestProg = pr; best = e; }
  }
  return best;
}

/* 冷凝塔：光环减速取最大值（不叠加）+ 持续每目标伤害 */
function updateCryo(t, dtMs) {
  var R = towerRng(t), slow = towerSlow(t), dps = towerDps(t);
  var frost = t.lv >= 2 ? 20 : 0;
  var dt = dtMs / 1000, i, e;
  for (i = 0; i < G.enemies.length; i++) {
    e = G.enemies[i];
    if (!e.alive) continue;
    if (Math.hypot(e.x - t.site.x, e.y - t.site.y) > R) continue;
    if (slow > e.slowPct) e.slowPct = slow;
    if (frost > e.frost) e.frost = frost;
    if (dps > 0) {
      /* 光环伤害无视护甲（GDD §3.6：C 对 ARM0 / ARM55 每金币 DPS 相同），但仍受 WARDEN 光环影响 */
      var amt = dps * dt;
      if (e.auraMul < 1) amt *= e.auraMul;
      e.hp -= amt;
      if (e.hp <= 0) killEnemy(e);
      else if (e.isBoss) checkBossSummon(e);
    }
  }
}

function updateTowers(dtMs) {
  var i, t;
  /* 先清空 C 影响标记，再由冷凝塔写入 */
  for (i = 0; i < G.enemies.length; i++) { G.enemies[i].slowPct = 0; G.enemies[i].frost = 0; }
  for (i = 0; i < G.towers.length; i++) {
    t = G.towers[i];
    t.spin += dtMs * 0.0000436 * TAU;       // 25°/s
    if (t.flash > 0) t.flash -= dtMs;
    if (t.upgradeFx > 0) t.upgradeFx -= dtMs;
    if (t.def.kind === 'aura') { updateCryo(t, dtMs); continue; }

    if (t.cdMs > 0) t.cdMs -= dtMs;
    if (t.cdMs > 0) continue;

    var target = pickTarget(t, 0);
    if (!target) { t.lockEid = 0; t.lockMs = 0; continue; }

    /* A 的「锁定」：对同一目标连续攻击 ≥2.0s 后 ×1.15 */
    if (t.type === 'A' && t.lv >= 1) {
      if (t.lockEid === target.eid) t.lockMs += towerCd(t);
      else { t.lockEid = target.eid; t.lockMs = 0; }
    }
    var lockBonus = (t.type === 'A' && t.lv >= 1 && t.lockMs >= 2000) ? 1.15 : 1;

    t.angle = Math.atan2(target.y - t.site.y, target.x - t.site.x);
    t.cdMs = towerCd(t);
    t.flash = 90;

    if (t.type === 'A') {
      sfx('shootA');
      if (t.lv >= 2) {
        /* 双联：2 枚弹丸各 50% 伤害，可分别选目标 */
        fireBullet(t, target, towerDmg(t) * 0.5 * lockBonus);
        var t2 = pickTarget(t, target.eid);
        fireBullet(t, t2 || target, towerDmg(t) * 0.5 * lockBonus);
      } else {
        fireBullet(t, target, towerDmg(t) * lockBonus);
      }
    } else if (t.type === 'B') {
      sfx('shootB');
      fireShell(t, target);
    } else if (t.type === 'D') {
      sfx('shootD');
      fireBeam(t, target);
    }
  }
}

/* =========================================================== 20. 弹道/弹丸 */
var SHOT_MAX = 320;
var shots = new Array(SHOT_MAX);
(function () {
  for (var i = 0; i < SHOT_MAX; i++) {
    shots[i] = { active: false, kind: 0, x: 0, y: 0, sx: 0, sy: 0, tx: 0, ty: 0, vx: 0, vy: 0,
      dmg: 0, pen: 0, splash: 0, color: C.white, eid: 0, tMs: 0, durMs: 0, mortar: false, slowPct: 0,
      tower: null, lifeMs: 0, maxLife: 0, ageMs: 0, has2: false, tx2: 0, ty2: 0 };
  }
})();
var shotCursor = 0;
function allocShot() {
  for (var i = 0; i < SHOT_MAX; i++) {
    var idx = (shotCursor + i) % SHOT_MAX;
    if (!shots[idx].active) { shotCursor = (idx + 1) % SHOT_MAX; return shots[idx]; }
  }
  return null;
}
function fireBullet(t, target, dmg) {
  var s = allocShot(); if (!s) return;
  s.active = true; s.kind = 1; s.mortar = false;
  s.x = t.site.x; s.y = t.site.y - 6; s.sx = s.x; s.sy = s.y;
  s.dmg = dmg; s.pen = towerPen(t); s.color = t.def.color; s.eid = target.eid;
  s.tower = t; s.lifeMs = 0; s.maxLife = 900;
  var d = Math.hypot(target.x - s.x, target.y - s.y);
  s.vx = (target.x - s.x) / Math.max(0.001, d) * 1050;
  s.vy = (target.y - s.y) / Math.max(0.001, d) * 1050;
  pBurst(t.site.x + Math.cos(t.angle) * 12, t.site.y + Math.sin(t.angle) * 12, 3, t.def.color, 90, 2, 90);
}
function fireShell(t, target) {
  var s = allocShot(); if (!s) return;
  s.active = true; s.kind = 2; s.mortar = true;
  s.sx = t.site.x; s.sy = t.site.y - 8; s.x = s.sx; s.y = s.sy;
  /* 预判落点 */
  var pm = G.map.lanes[target.lane] || G.map.lanes[0];
  var spd = target.baseSpd * (1 - Math.min(0.6, Math.max(target.slowPct, target.mortarSlowPct)));
  var ahead = pathPoint(pm, Math.min(pm.total, target.prog + spd * 0.45));
  s.tx = ahead.x; s.ty = ahead.y;
  var d = Math.hypot(s.tx - s.sx, s.ty - s.sy);
  s.durMs = Math.max(220, d / 340 * 1000);
  s.tMs = 0;
  s.dmg = towerDmg(t); s.pen = towerPen(t); s.splash = towerSplash(t);
  s.color = t.def.color; s.tower = t;
  s.slowPct = t.lv >= 2 ? 0.20 : 0;      // Lv3 震爆：−20% 移速 1.0s
}
function fireBeam(t, target) {
  var dmg = towerDmg(t), pen = towerPen(t), secondHit = null;
  applyDamage(target, dmg, pen, 'D');
  pBurst(target.x, target.y, 4, t.def.color, 120, 2, 160);
  /* Lv3 贯穿：弹道延长线 60px 内最近的第 2 个敌人，60% 伤害 */
  if (t.lv >= 2) {
    var ang = Math.atan2(target.y - t.site.y, target.x - t.site.x);
    var dirX = Math.cos(ang), dirY = Math.sin(ang);
    var second = null, bestD = 1e9, i, e;
    for (i = 0; i < G.enemies.length; i++) {
      e = G.enemies[i];
      if (!e.alive || e === target) continue;
      if (e.isFlying && !t.def.canHitAir) continue;
      var rx = e.x - t.site.x, ry = e.y - t.site.y;
      var along = rx * dirX + ry * dirY;
      if (along <= 0) continue;
      var perp = Math.abs(rx * dirY - ry * dirX);
      if (perp > 12) continue;
      var gap = along - Math.hypot(target.x - t.site.x, target.y - t.site.y);
      if (gap < 0 || gap > 60) continue;
      if (gap < bestD) { bestD = gap; second = e; }
    }
    if (second) {
      /* 与主目标同帧结算（30ms 只是光束表现延迟，绝不延迟伤害） */
      applyDamage(second, dmg * 0.60, pen, 'D');
      pBurst(second.x, second.y, 3, t.def.color, 90, 2, 140);
      secondHit = second;
    }
  }
  /* 视觉：主段 120ms，贯穿段 90ms（延迟 30ms 出现）；光束在首目标处不得中断 */
  var s = allocShot(); if (!s) return;
  s.active = true; s.kind = 3;
  s.x = t.site.x; s.y = t.site.y - 8; s.tx = target.x; s.ty = target.y;
  s.lifeMs = fxDur(120); s.maxLife = s.lifeMs; s.ageMs = 0;
  s.has2 = !!secondHit;
  if (secondHit) { s.tx2 = secondHit.x; s.ty2 = secondHit.y; }
  s.color = t.def.color;
}

function updateShots(dtMs) {
  var i, s, e, j;
  for (i = 0; i < SHOT_MAX; i++) {
    s = shots[i];
    if (!s.active) continue;
    if (s.kind === 1) {
      s.lifeMs += dtMs;
      e = null;
      for (j = 0; j < G.enemies.length; j++) if (G.enemies[j].eid === s.eid && G.enemies[j].alive) { e = G.enemies[j]; break; }
      if (e) {
        var dx = e.x - s.x, dy = e.y - s.y, d = Math.hypot(dx, dy);
        var step = 1050 * dtMs / 1000;
        if (d <= step + 6) {
          applyDamage(e, s.dmg, s.pen, 'A');
          pBurst(e.x, e.y, 3, C.warn, 80, 2, 140);
          s.active = false;
        } else { s.x += dx / d * step; s.y += dy / d * step; }
      } else s.active = false;
      if (s.lifeMs > s.maxLife) s.active = false;
    } else if (s.kind === 2) {
      s.tMs += dtMs;
      var t = Math.min(1, s.tMs / s.durMs);
      s.x = s.sx + (s.tx - s.sx) * t;
      s.y = s.sy + (s.ty - s.sy) * t - Math.sin(t * Math.PI) * 26;   // 抛物线视觉高度
      if (t >= 1) {
        /* 落点溅射：以落点为中心遍历，按距离衰减（GDD 附录 2） */
        var R = s.splash, i2, e2;
        for (i2 = 0; i2 < G.enemies.length; i2++) {
          e2 = G.enemies[i2];
          if (!e2.alive || e2.isFlying) continue;
          var dd = Math.hypot(e2.x - s.tx, e2.y - s.ty);
          if (dd > R) continue;
          var fall = 1 - (1 - MOD.splashEdge) * (dd / R);
          applyDamage(e2, s.dmg * fall, s.pen, 'B');
          if (s.slowPct > 0) { e2.mortarSlowPct = s.slowPct; e2.mortarSlowMs = 1000; }
        }
        pBurst(s.tx, s.ty, 8, s.color, 150, 3, 320);
        pBurst(s.tx, s.ty, 3, C.warn, 80, 2, 220);
        s.active = false;
      }
    } else if (s.kind === 3) {
      s.ageMs += dtMs;
      s.lifeMs -= dtMs;
      if (s.lifeMs <= 0) s.active = false;
    }
  }
}
function drawShots() {
  var i, s, e, j;
  for (i = 0; i < SHOT_MAX; i++) {
    s = shots[i];
    if (!s.active) continue;
    if (s.kind === 1) {
      ctx.globalCompositeOperation = 'lighter';
      circle(s.x, s.y, 3.4, s.color);
      circle(s.x, s.y, 1.6, C.white);
      ctx.globalCompositeOperation = 'source-over';
    } else if (s.kind === 2) {
      circle(s.x, s.y, 4, s.color);
      ring(s.x, s.y, 5.5, s.color, 1);
      /* 落点环（表达溅射范围） */
      ring(s.tx, s.ty, s.splash, s.color, 1);
      void e; void j;
    } else if (s.kind === 3) {
      var a = s.lifeMs / s.maxLife;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a;
      line(s.x, s.y, s.tx, s.ty, s.color, 7);
      line(s.x, s.y, s.tx, s.ty, C.white, 2);
      if (s.has2 && s.ageMs >= 30) {       /* 贯穿段：30ms 纯视觉延迟 */
        ctx.globalAlpha = Math.min(1, s.lifeMs / 90) * 0.55;
        line(s.tx, s.ty, s.tx2, s.ty2, s.color, 4);
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      if (s.has2 && s.ageMs >= 30) {       /* 第 2 目标身上 r6→14 环（120ms） */
        var k2 = Math.min(1, (s.ageMs - 30) / 120);
        ctx.globalAlpha = 0.85 * (1 - k2);

      }

  }
}

/* ============================================================ 21. 波次系统 */
function buildQueue(def) {

  var counts = [], maxN = 0, i, k;
  for (i = 0; i < codes.length; i++) {
    var n = def[codes[i]] || 0;
    counts.push(n);
    if (n > maxN) maxN = n;
  }
  var list = [];
  for (k = 0; k < maxN; k++) {
    for (i = 0; i < codes.length; i++) if (k < counts[i]) list.push(WAVE_CODE[codes[i]]);

}
function waveDefForLane(wd, laneIdx, laneCount) {
  if (wd.A || wd.B) return wd[laneCount > 1 && laneIdx === 1 ? 'B' : 'A'] || null;

}
function startWave() {

  var laneCount = G.map.lanes.length;
  var li, key, def;
  for (li = 0; li < laneCount; li++) {
    key = (li === 0 ? 'A' : 'B');
    def = waveDefForLane(wd, li, laneCount);
    G.queues.push(def ? buildQueue(def) : { list: [], i: 0, tMs: 0, bossHP: 0 });
  }
  banner('第 ' + G.wave + ' / 12 波');
  sfx('wave');
  var hasBoss = (wd.x || 0) > 0 || (wd.A && wd.A.x) || (wd.B && wd.B.x);
  if (hasBoss) { G.bossFlashMs = fxDur(1600); sfx('boss'); }
}
function updateWave(dtMs) {
  /* 波间倒计时不在这里：它走独立时钟（rawDt 门控），见 updateReal */
  if (G.phase !== 'WAVE') return;
  var i, q, gap = WAVE_GAP[Math.min(11, Math.max(0, G.wave - 1))];
  for (i = 0; i < G.queues.length; i++) {

    var guard = 0;
    while (q.tMs <= 0 && q.i < q.list.length && guard < 8) {
      guard++;
      var type = q.list[q.i++];
      spawnEnemy(type, i, { hp: q.bossHP });

  for (i = 0; i < G.queues.length; i++) queued += (G.queues[i].list.length - G.queues[i].i);

  G.gold += bonus + interest;
  if (MOD.repairPerWave) {
    var before = G.baseHP;
    G.baseHP = Math.min(G.baseMax, G.baseHP + MOD.repairPerWave);

/* 剩余整秒数（20s 上限）。奖励 = 剩余整秒 × 2 → 20×2 = 40 恰为上限，

/* ============================================================ 22. 建造操作 */
function hint(msg) { G.hintText = msg; G.hintMs = 1600; }

function buildAtSite(site, type) {
  if (!site || site.tower) return false;
  if (site.high && type !== 'A' && type !== 'D') { sfx('error'); hint('高台位仅可建造 A / D'); return false; }
  var cost = TOWERS[type].cum[0];
  if (G.gold < cost) { sfx('error'); hint('金币不足（需 ' + cost + '）'); return false; }
  G.gold -= cost;
  var t = makeTower(site, type);
  site.tower = t;
  G.towers.push(t);
  pBurst(site.x, site.y, 8, TOWERS[type].color, 90, 3, 320);
  sfx('build');

}
function upgradeCost(t) {

}
function upgradeTower(t) {

  G.gold -= cost;
  t.lv++;

}
/* 先定到分再取整：invested×0.70 在浮点下得 244.99999999999997，直接 floor 会少 1 金币。

function sellValue(t) { return Math.floor(Math.round(t.invested * MOD.refund * 100) / 100); }
function sellTower(t) {

  pBurst(t.site.x, t.site.y, 6, C.text2, 70, 3, 280);

}

/* ============================================================ 23. 开局/结算 */
function startGame(mapId) {
  if (!MAPS[mapId]) return;
  resetGameState();
  recomputeTech();
  G.mapId = mapId;
  G.map = buildMap(mapId);
  var def = MAPS[mapId];
  G.baseMax = def.baseHP + MOD.baseHPAdd;
  G.baseHP = G.baseMax;
  G.gold = def.gold;
  G.wave = 0;
  G.phase = 'PREP';
  G.gapMs = 0;
  G.state = 'PLAY';
  G.speed = 1; G.paused = false;
  G.dominantArmor = dominantArmor();
  UI.focus = -1;
  bgDirty = true;
  sfx('click');
}
function dominantArmor() {
  var w = WAVES[G.mapId][Math.min(11, Math.max(0, G.wave))];
  var acc = {}, total = 0, k, i;
  function add(def) {
    if (!def) return;
    for (k in def) {
      if (!def.hasOwnProperty(k)) continue;
      if (k === 'bossHP') continue;
      var code = WAVE_CODE[k];
      if (!code) continue;
      var n = def[k];
      var arm = ENEMIES[code].arm;
      acc[arm] = (acc[arm] || 0) + n;
      total += n;
    }
  }
  add(w);
  if (w.A || w.B) { add(w.A); add(w.B); }
  if (!total) return 0;
  var best = 0, bestN = -1;
  for (k in acc) if (acc.hasOwnProperty(k)) { if (acc[k] > bestN) { bestN = acc[k]; best = parseInt(k, 10); } }
  void i;

}
function endGame(win) {

  G.phase = 'OVER';

  var W = Math.min(1, G.cleared / 12);
  var H = 0.6 + 0.4 * (G.baseHP / Math.max(1, G.baseMax));
  var base = Math.floor(def.baseTP * W * H);
  var firstBonus = 0;
  if (win && !save.firstClear[G.mapId]) firstBonus = 5;
  var tp = base + firstBonus;
  save.tp += tp;
  if (win) save.firstClear[G.mapId] = 1;
  save.bestWave[G.mapId] = Math.max(save.bestWave[G.mapId] || 0, G.cleared);
  save.totalKills = (save.totalKills || 0) + G.kills;
  writeSave();
  G.result = {
    win: win, tp: tp, tpBase: base, firstBonus: firstBonus,
    kills: G.kills, leaks: G.leaks, leaksTotal: G.leaksTotal,
    timeMs: G.battleMs, cleared: G.cleared

    ctx.globalAlpha = 0.35;
    line(-9, 0, -17, 0, col, 3);
    ctx.globalAlpha = 1;
    ctx.restore();
  } else if (e.def.shape === 'rect') {
    ctx.save();
    ctx.translate(x, y);
    roundRectPath(-5.5, -5.5, 11, 11, 3);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = edgeW; ctx.stroke();
    fillRect(-2, -4, 4, 8, TH.warn);
    ctx.restore();
  } else if (e.def.shape === 'vwing') {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(e.a + Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(0, -6); ctx.lineTo(-8, 6); ctx.lineTo(0, 2); ctx.lineTo(8, 6); ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 1; ctx.stroke();
    if (!UI.reducedMotion) ctx.setLineDash([]);
    circle(0, 0, 2.5, C.white);
    ctx.restore();
  } else if (e.def.shape === 'hex') {
    polyPath(x, y, 15, 6, Math.PI / 6);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = edgeW; ctx.stroke();
    line(x - 6, y, x + 6, y, C.bg, 2);
    line(x, y - 6, x, y + 6, C.bg, 2);
    /* 护盾光环：1.5px wardenAura @α0.55 虚线（dash 8/6），中心留空 r20→90
       虚线是刻意的：与玩家射程圈（实线）形状区分，避免误读为友方建筑 */
    if (e.def.auraR) {
      var aur = e.def.auraR;
      ctx.globalAlpha = 0.55;
      ctx.save(); ctx.setLineDash([8, 6]);
      ctx.strokeStyle = C.wardenAura; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, aur, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.stroke();
      ctx.restore();
      ctx.globalAlpha = 0.06;
      ctx.strokeStyle = C.wardenAura; ctx.lineWidth = aur - 20;
      ctx.beginPath(); ctx.arc(x, y, (aur + 20) / 2, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  } else {
    /* Boss：八边形 + 反向内环 + 3 点核心 */
    ctx.save();
    ctx.translate(x, y);
    polyPath(0, 0, 28, 8, Math.PI / 8);
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = TH.danger; ctx.lineWidth = 2; ctx.stroke();
    /* 内环：反向旋转；损伤阶段用「断口数 0/1/2/3」编码（主编码，不依赖颜色） */
    var frac = Math.max(0, e.hp / e.maxHp);
    var stage = frac > 0.75 ? 0 : (frac > 0.50 ? 1 : (frac > 0.25 ? 2 : 3));
    var ringCol = [TH.danger, C.bossStage2, TH.warn, C.white][stage];
    var spin = -(e.tMs % 5000) / 5000 * TAU;
    ctx.strokeStyle = ringCol; ctx.lineWidth = 2;
    for (var gi = 0; gi < 3; gi++) {
      var gapStart = spin + gi * TAU / 3 + 0.349;   /* 40° 缺口，三等分均布 */
      if (gi < stage) continue;
      ctx.beginPath();
      ctx.arc(0, 0, 18, gapStart, gapStart + TAU / 3 - 0.698);
      ctx.stroke();
    }
    ctx.restore();
    for (var i = 0; i < 3; i++) {
      var a = -Math.PI / 2 + i * TAU / 3 + (e.tMs % 3000) / 3000 * TAU;
      circle(x + Math.cos(a) * 7, y + Math.sin(a) * 7, 3, C.white);
    }
    /* 脉冲环 900ms（双 Boss 同屏时收窄到 R30/α0.10，避免两环交叠成噪点） */
    var twin = 0, q;
    for (q = 0; q < G.enemies.length; q++) if (G.enemies[q].alive && G.enemies[q].isBoss) twin++;
    var ph = (e.tMs % 900) / 900;
    ctx.globalAlpha = (twin > 1 ? 0.10 : 0.15) + (twin > 1 ? 0.10 : 0.35) * Math.sin(ph * Math.PI);
    ring(x, y, twin > 1 ? 30 : 34, TH.danger, 2);
    ctx.globalAlpha = 1;
    /* 召唤预告：R20→40 扩散环（400ms），先于召唤物出现 */
    if (e.ringMs > 0) {
      var rk = 1 - e.ringMs / BOSS_TG_MS;
      ctx.globalAlpha = 0.85 * (1 - rk);
      ring(x, y, 20 + rk * 20, C.wardenAura, 2);
      ctx.globalAlpha = 1;
    }
  }

  /* 减速霜环（1px 冰蓝 α0.25） */
  if (e.slowPct > 0 || e.mortarSlowPct > 0) {
    ctx.globalAlpha = 0.6;
    ring(x, y, e.isBoss ? 30 : 13, PALETTE.tower.C, 1);
    ctx.globalAlpha = 1;
  }
  /* 霜蚀降甲标记（C Lv3） */
  if (e.frost > 0) {
    ctx.globalAlpha = 0.85;
    for (var f = 0; f < 3; f++) {
      var fa = e.tMs / 900 + f * TAU / 3;
      circle(x + Math.cos(fa) * (e.isBoss ? 32 : 15), y + Math.sin(fa) * (e.isBoss ? 32 : 15), 1.6, C.iceLight);
    }
    ctx.globalAlpha = 1;
  }
  /* 护盾减伤指示 */
  if (e.auraMul < 1) {
    ctx.globalAlpha = 0.5;
    ring(x, y, e.isBoss ? 31 : 14, TH.ok, 1.5);
    ctx.globalAlpha = 1;
  }

  /* 血条：长度 + 颜色 + 数字三重编码 */
  if (e.hp < e.maxHp || e.isBoss) {
    var w = e.isBoss ? 56 : 22;
    var hh = e.isBoss ? 5 : 3;
    var by = y - (e.isBoss ? 40 : 20);
    var frac = Math.max(0, e.hp / e.maxHp);
    fillRect(x - w / 2, by, w, hh, C.bg);
    var hcol = frac <= 0.25 ? TH.danger : (frac <= 0.5 ? TH.warn : TH.accent);
    fillRect(x - w / 2, by, w * frac, hh, hcol);
    strokeRect(x - w / 2, by, w, hh, C.grid, 1);
    if (e.isBoss || e.type === 'BULWARK' || e.type === 'WARDEN') {
      text(Math.ceil(e.hp) + '', x, by - 4, 12, C.text, 'center', 600, true);
    }
  }
  /* 护甲标记（可读性：ARM 数字直接在体侧） */
  if (e.arm > 0 && (e.type === 'BULWARK' || e.isBoss)) {
    text('A' + Math.round(Math.max(0, e.arm - e.frost)), x, y + (e.isBoss ? 44 : 20), 12, C.text2, 'center', 600, true);
  }
}

/* 下一波预览条：(16,656) 752×48，6 槽 宽104 起点x=88 步长111（末槽止 747）
   必须排在「提前召唤」按钮之前（左），否则玩家在信息不全时决策，违反 P1 */
function drawPreview() {
  var r = UI.previewRect;
  fillRect(r.x, r.y, r.w, r.h, C.ground);
  strokeRect(r.x, r.y, r.w, r.h, C.grid, 1);
  text('下一波', 24, r.y + 29, 12, C.text2, 'left', 600);
  var idx = Math.min(11, G.wave);
  var wd = WAVES[G.mapId][idx];
  if (!wd) return;
  var acc = [], k, code, n;
  function add(def) {
    if (!def) return;
    for (k in def) {
      if (!def.hasOwnProperty(k) || k === 'bossHP') continue;
      code = WAVE_CODE[k];
      if (!code) continue;
      n = def[k];
      var found = null, j;
      for (j = 0; j < acc.length; j++) if (acc[j].code === code) found = acc[j];
      if (found) found.n += n;
      else acc.push({ code: code, n: n });
    }
  }
  add(wd); if (wd.A || wd.B) { add(wd.A); add(wd.B); }
  var slot = 0, sx, se;
  for (k = 0; k < acc.length && slot < 6; k++, slot++) {
    se = ENEMIES[acc[k].code];
    sx = 88 + slot * 111;
    drawEnemyIcon(se, sx + 11, r.y + 20, 0.62);
    text('×' + acc[k].n, sx + 26, r.y + 25, 12, C.text, 'left', 600, true);
    text('ARM ' + se.arm, sx + 2, r.y + 41, 12, se.arm > 0 ? TH.warn : C.text2, 'left', 600, true);
  }
  text('第 ' + (idx + 1) + ' 波', r.x + r.w - 10, r.y + 29, 12, C.text2, 'right', 400);
}
function drawEnemyIcon(def, cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  if (def.shape === 'tri') { polyPath(0, 0, 11, 3, Math.PI / 2); }
  else if (def.shape === 'diamond') { ctx.beginPath(); ctx.moveTo(11, 0); ctx.lineTo(0, 6); ctx.lineTo(-11, 0); ctx.lineTo(0, -6); ctx.closePath(); }
  else if (def.shape === 'rect') { roundRectPath(-7, -7, 14, 14, 3); }
  else if (def.shape === 'vwing') { ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(-10, 8); ctx.lineTo(0, 3); ctx.lineTo(10, 8); ctx.closePath(); }
  else if (def.shape === 'hex') { polyPath(0, 0, 12, 6, Math.PI / 6); }
  else { polyPath(0, 0, 13, 8, Math.PI / 8); }
  ctx.fillStyle = def.color; ctx.fill();
  ctx.strokeStyle = rgba(C.edge, 0.5); ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

/* 建造栏 4 卡（动态值） */
function drawCards() {
  var dominant = dominantArmor();
  var i;
  for (i = 0; i < 4; i++) {
    var id = TOWER_IDS[i], def = TOWERS[id], cy = UI.cardY[i], ch = UI.cardH;
    var cost = def.cum[0];
    var can = G.gold >= cost;
    var sel = G.buildType === id;
    if (sel) strokeRect(UI.cardX, cy, UI.cardW, ch, def.color, 3);
    if (!can) {
      /* 可负担态：斜纹 + 斜十字（禁用语义不靠颜色，art-bible §3.4） */
      ctx.save();
      ctx.beginPath(); ctx.rect(UI.cardX, cy, UI.cardW, ch); ctx.clip();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = C.locked; ctx.lineWidth = 2;
      ctx.beginPath();
      for (var s2 = -ch; s2 < UI.cardW; s2 += 16) {
        ctx.moveTo(UI.cardX + s2, cy + ch); ctx.lineTo(UI.cardX + s2 + ch, cy);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.restore();
      disabledCross(UI.cardX + UI.cardW - 22, cy + 52, 14, C.locked);
    }
    /* 造价（16px 等宽，宽度不跳动） */
    text(cost + 'G', 1068, cy + 48, 16, can ? TH.warn : C.text2, 'left', 600, true);
    /* 有效 DPS：按「下一波占比最高的护甲」动态换算（GDD §3.7 / P1） */
    var dpsTxt;
    if (id === 'C') {
      dpsTxt = '减速' + Math.round(def.lv[0].slow * 100) + '% ' + def.lv[0].dps.toFixed(1) + '/目标';
    } else {
      var lv0 = def.lv[0];
      var r = dmgCalc(lv0.dmg * MOD.dmgMul, dominant, effPen(lv0.pen || 0));
      var dps = lv0.dmg * MOD.dmgMul * (1000 / lv0.cdMs) * (1 - r.mit);
      dpsTxt = dps.toFixed(1) + ' vs ARM' + dominant + (id === 'B' ? ' ×2.6' : '');
    }
    text(dpsTxt, 1024, cy + 70, 14, can ? C.text : C.text2, 'left', 600, true);
  }
  /* 科技加成提示 */
  var bonus = [];
  if (save.tech.F1) bonus.push('伤害+8%');
  if (save.tech.F3) bonus.push('穿甲+20%');
  if (save.tech.E1) bonus.push('回收85%');
  if (save.tech.D1) bonus.push('HP+5');
  if (save.tech.D2) bonus.push('每波回1');
  if (save.tech.E3) bonus.push('利息6%');
  if (save.tech.E2) bonus.push('赏金+12%');
  if (save.tech.F2) bonus.push('溅射+25%');
  if (bonus.length) text(bonus.join(' '), 1256, 78, 12, C.text2, 'right', 400);
}
/* 选中塔详情 */
function drawTowerPanel() {
  var p = UI.towerPanel, t = G.selTower;
  if (!t) {
    text('未选中防御塔', p.x + p.w / 2, p.y + 30, 14, C.text2, 'center', 400);
    text('点空位建造 · 点塔查看详情', p.x + p.w / 2, p.y + 58, 12, C.text2, 'center', 400);
    text('1-4 选塔种 · Esc 取消 · [ ] 倍速', p.x + p.w / 2, p.y + 84, 12, C.text2, 'center', 400);
    return;
  }
  var dominant = dominantArmor();
  text(t.def.name, p.x + 12, p.y + 24, 20, t.def.color, 'left', 600);
  /* 等级：3 个 8×8 方块（形状编码，非颜色） */
  for (var li = 0; li < 3; li++) {
    fillRect(p.x + 12 + li * 12, p.y + 38, 8, 8, li <= t.lv ? t.def.color : C.grid);
    strokeRect(p.x + 12 + li * 12, p.y + 38, 8, 8, C.grid, 1);
  }
  /* 当前 / 升级后有效 DPS（vs 下一波主要护甲） */
  function effDps(lv) {
    var d = t.def.lv[lv];
    if (t.def.kind === 'aura') return d.dps;
    var rr = dmgCalc(d.dmg * MOD.dmgMul, dominant, effPen(d.pen || 0));
    return d.dmg * MOD.dmgMul * (1000 / d.cdMs) * (1 - rr.mit);
  }
  var dpsNow = effDps(t.lv);
  var dpsNext = t.lv < 2 ? effDps(t.lv + 1) : 0;
  text('DPS ' + dpsNow.toFixed(1) + (t.lv < 2 ? ' → ' + dpsNext.toFixed(1) : ''),
    p.x + p.w - 12, p.y + 50, 16, C.text, 'right', 600, true);
  /* 关键数值一行 */
  var line;
  if (t.def.kind === 'aura') {
    line = '减速 ' + Math.round(towerSlow(t) * 100) + '% · 射程 ' + Math.round(towerRng(t));
  } else {
    line = '伤害 ' + Math.round(towerDmg(t)) + ' · 射程 ' + Math.round(towerRng(t)) +
      ' · 间隔 ' + (towerCd(t) / 1000).toFixed(2) + 's';
  }
  text(line, p.x + 12, p.y + 70, 12, C.text2, 'left', 400);
  /* 升级 / 出售 */
  var upR = { x: p.x + 12, y: p.y + 78, w: 148, h: 34 };
  var slR = { x: p.x + 164, y: p.y + 78, w: 80, h: 34 };
  if (t.lv < 2) {
    var uc = upgradeCost(t), canUp = G.gold >= uc;
    strokeRect(upR.x, upR.y, upR.w, upR.h, canUp ? TH.ok : C.locked, 2);
    text('升级 ' + uc + 'G', upR.x + upR.w / 2, upR.y + 22, 14, canUp ? TH.ok : C.text2, 'center', 600);
    if (!canUp) disabledCross(upR.x + upR.w - 14, upR.y + 17, 9, C.locked);
  } else {
    strokeRect(upR.x, upR.y, upR.w, upR.h, C.grid, 2);
    text('已满级 Lv3', upR.x + upR.w / 2, upR.y + 22, 14, C.text2, 'center', 600);
  }
  strokeRect(slR.x, slR.y, slR.w, slR.h, TH.danger, 2);
  text('出售 ' + sellValue(t), slR.x + slR.w / 2, slR.y + 22, 14, TH.danger, 'center', 600);
}

/* 绘制入口：局内 */
function drawPlay(dtMs) {
  if (bgDirty) renderStatic();
  ctx.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
  ctx.fillStyle = C.black;
  ctx.fillRect(0, 0, VIEW.w, VIEW.h);
  var s = VIEW.scale * VIEW.dpr;
  var ox = (VIEW.ox + shakeX()) * VIEW.dpr;
  var oy = (VIEW.oy + shakeY()) * VIEW.dpr;
  ctx.setTransform(s, 0, 0, s, ox, oy);

  ctx.drawImage(bgCanvas, 0, 0);

  drawBase();
  drawRangeCircles();
  drawSites(dtMs);
  drawTowers(dtMs);
  var i;
  for (i = 0; i < G.enemies.length; i++) if (G.enemies[i].alive) drawEnemy(G.enemies[i]);
  drawShots();
  pDraw();

  drawTopBar();
  drawBottomBar();
  drawCards();
  drawTowerPanel();

  /* 暂停压暗（仍完全可读） */
  if (G.paused) {
    ctx.globalAlpha = 0.30;
    fillRect(FIELD_X, FIELD_Y, FIELD_W, FIELD_H, C.black);
    ctx.globalAlpha = 1;
  }
  /* 漏怪红罩 */
  if (G.flashMs > 0) {
    var k = G.flashMs / Math.max(1, G.flashMax);
    var a = Math.sin((1 - k) * Math.PI) * 0.28;

function drawMapThumb(mapId, x, y, w, h) {
  var def = MAPS[mapId];
  var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9, i, j;
  for (i = 0; i < def.paths.length; i++) {
    for (j = 0; j < def.paths[i].length; j++) {

      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }

  fillRect(x, y, w, h, C.ground);
  var pad = 12;
  var sc = Math.min((w - pad * 2) / Math.max(1, maxX - minX), (h - pad * 2) / Math.max(1, maxY - minY));
  var ox = x + (w - (maxX - minX) * sc) / 2 - minX * sc;
  var oy = y + (h - (maxY - minY) * sc) / 2 - minY * sc;
  /* 点位 */
  for (i = 0; i < def.pts.length; i++) {
    var q = def.pts[i];
    var px = ox + q[0] * 40 + 20 * sc + (GRID_OX) * sc - 0 * sc;
    var py = oy + (GRID_OY + q[1] * 40 + 20) * sc;
    px = ox + (q[0] * 40 + 20) * sc;
    ctx.globalAlpha = 0.75;
    circle(px, py, 1.6, q.length > 3 && q[3] ? TH.warn : C.text2);
    ctx.globalAlpha = 1;
  }
  /* 路径 */
  ctx.strokeStyle = C.path; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (i = 0; i < def.paths.length; i++) {
    ctx.beginPath();
    for (j = 0; j < def.paths[i].length; j++) {
      var pp = def.paths[i][j];
      var sx = ox + pp[0] * sc, sy = oy + pp[1] * sc;
      if (j === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    }
    ctx.stroke();
  }
  /* 基地 */
  var bx = ox + def.base[0] * sc, by = oy + def.base[1] * sc;
  fillRect(bx - 5, by - 5, 10, 10, TH.accent);
  strokeRect(x, y, w, h, C.grid, 1);
}

    text('确认重置', 600, 430, 15, TH.danger, 'center', 600);
    strokeRect(720, 400, 160, 48, C.grid, 2);
    text('取消', 800, 430, 15, C.text2, 'center', 600);
  }
}

/* ================================================================ 33. 设置 */
function drawSettings() {
  ctx.fillStyle = rgba(C.bg, 0.90);
  ctx.fillRect(0, 0, LW, LH);
  var x = 360, y = 150, w = 560, h = 420;
  fillRect(x, y, w, h, C.panel);
  strokeRect(x, y, w, h, C.grid, 2);
  text('设置', x + 28, y + 44, 28, C.text, 'left', 700);
  text('可访问性选项（A5 / A3 / A4）', x + 28, y + 68, 12, C.text2, 'left', 400);

  var rows = [
    ['减少动效', '关闭屏幕抖动 / 红罩闪烁 / Boss 暗角；粒子 ≤3、时长 ≤120ms'],
    ['色盲模式', '仅替换强调色与危险色映射，几何不变'],
    ['UI 缩放', '仅缩放 HUD 文本，不缩放战场']
  ];
  var i;
  for (i = 0; i < 3; i++) {
    text(rows[i][0], x + 28, y + 116 + i * 92, 16, C.text, 'left', 600);
    text(rows[i][1], x + 28, y + 136 + i * 92, 12, C.text2, 'left', 400);
    var bx = x + 28;
    if (i === 0) {
      strokeRect(bx, y + 148, 120, 38, UI.reducedMotion ? TH.ok : C.grid, 2);
      fillRect(bx, y + 148, 120, 38, UI.reducedMotion ? rgba(TH.ok, 0.14) : rgba(C.bg, 0));
      text(UI.reducedMotion ? '已开启' : '关闭', bx + 60, y + 173, 14, UI.reducedMotion ? TH.ok : C.text2, 'center', 600);
    } else if (i === 1) {
      var opts = [['off', '关'], ['deuter', '红绿'], ['trit', '蓝黄']];
      for (var k = 0; k < 3; k++) {
        var on = UI.colorblind === opts[k][0];
        strokeRect(bx + k * 92, y + 148, 84, 38, on ? TH.accent : C.grid, 2);
        if (on) fillRect(bx + k * 92, y + 148, 84, 38, rgba(TH.accent, 0.14));
        text(opts[k][1], bx + k * 92 + 42, y + 173, 14, on ? TH.accent : C.text2, 'center', 600);
      }
    } else {
      var scales = [1, 1.25, 1.5];
      for (var k2 = 0; k2 < 3; k2++) {
        var on2 = UI.uiScale === scales[k2];
        strokeRect(bx + k2 * 92, y + 148, 84, 38, on2 ? TH.accent : C.grid, 2);
        if (on2) fillRect(bx + k2 * 92, y + 148, 84, 38, rgba(TH.accent, 0.14));
        text(Math.round(scales[k2] * 100) + '%', bx + k2 * 92 + 42, y + 173, 14, on2 ? TH.accent : C.text2, 'center', 600);
      }
    }
  }
  strokeRect(x + w - 148, y + h - 62, 120, 40, TH.accent, 2);
  text('关闭', x + w - 88, y + h - 36, 15, TH.accent, 'center', 600);
}
function settingsClick(x, y) {
  var bx = 388, by = 298;
  if (x >= 1180 - 348 + 0 && false) return;
  /* 关闭按钮 */
  if (x >= 772 && x <= 892 && y >= 508 && y <= 548) { G.settingsOpen = false; sfx('click'); return; }
  if (y >= 298 && y <= 336) {
    if (x >= bx && x <= bx + 120) {
      save.settings.reducedMotion = save.settings.reducedMotion ? 0 : 1;
      applySettings(); writeSave(); bgDirty = true; sfx('click'); return;
    }
  }
  if (y >= 390 && y <= 428) {
    var ids = ['off', 'deuter', 'trit'];
    for (var k = 0; k < 3; k++) {
      if (x >= bx + k * 92 && x <= bx + k * 92 + 84) {
        save.settings.colorblind = ids[k]; applySettings(); writeSave(); bgDirty = true; sfx('click'); return;
      }
    }
  }
  if (y >= 482 && y <= 520) {
    var scales = [1, 1.25, 1.5];
    for (var k2 = 0; k2 < 3; k2++) {
      if (x >= bx + k2 * 92 && x <= bx + k2 * 92 + 84) {
        save.settings.uiScale = scales[k2]; applySettings(); writeSave(); bgDirty = true; sfx('click'); return;
      }
    }
  }
  void by;
}

/* =============================================================== 34. 主循环 */
var lastTs = 0, acc = 0;
/* 世界时钟步进：只吃 worldDt（已乘 timeScale），固定步长 ≤50ms、最多 8 步/帧 */
function simulate(ms) {
  if (G.state !== 'PLAY' || G.phase === 'OVER') return;
  G.battleMs += ms;
  updateWardens(ms);
  updateTowers(ms);
  updateEnemies(ms);
  updateShots(ms);
  updateWave(ms);
  pUpdate(ms);
  G.bossFlashMs = Math.max(0, G.bossFlashMs - ms);
}
/* 三套时钟（art-bible §4.2 第 7/8 条）
   ① worldDt = rawDt × timeScale → 敌人/塔/弹道/粒子/减速/DoT/Boss 脉冲环
   ② rawDt（不缩放）           → 横幅/提示浮层/结算入场/按钮过渡/漏怪红罩/抖动
   ③ gapMs += rawDt（仅 timeScale>0）→ 波间倒计时；暂停不计、倍速不缩放
   暂停 = timeScale 0，不写独立 if(paused) 分支 */
function updateReal(rawDt) {
  var running = (G.state === 'PLAY' && G.phase !== 'OVER');
  var scale = running ? (G.paused ? 0 : G.speed) : 0;
  var worldDt = rawDt * scale;

  if (worldDt > 0) {
    var total = worldDt, guard = 0;
    while (total > 0 && guard < 8) {
      var step = Math.min(50, total);
      simulate(step);
      total -= step;
      guard++;
    }
  }
  /* ③ 波间倒计时：不乘 timeScale、暂停不累加（否则可暂停刷满奖励、倍速惩罚玩家） */
  if (running && scale > 0 && G.phase === 'PREP') {
    G.gapMs += rawDt;
    if (G.gapMs >= GAP_MS) { G.gapMs = GAP_MS; startWave(); }
  }
  /* ② UI 时钟：恒定 */
  if (G.hintMs > 0) G.hintMs -= rawDt;
  if (G.banner.ms > 0) G.banner.ms -= rawDt;
  if (shakeT > 0) shakeT -= rawDt;
  if (G.flashMs > 0) G.flashMs -= rawDt;
  if (G.state === 'PLAY') G.dominantArmor = dominantArmor();
}
function render(dt) {
  if (G.state === 'MENU') drawMenu(dt);
  else if (G.state === 'PLAY') drawPlay(dt);
  else if (G.state === 'RESULT') drawResult();
  else if (G.state === 'TECH') drawTech(dt);
  if (G.settingsOpen) { setLogical(); drawSettings(); }
}
function loop(ts) {
  if (!lastTs) lastTs = ts;
  var dt = ts - lastTs;
  lastTs = ts;
  if (dt < 0) dt = 0;
  if (dt > 80) dt = 80;
  updateReal(dt);
  render(dt);
  window.requestAnimationFrame(loop);
}

/* ============================================================ 35. 调试接口 */
window.__IV__ = {
  get state() { return G; },
  startMap: function (id) { startGame(id); return G.state; },
  spawnEnemy: function (type, lane, startDist) {
    if (!G.map) return null;
    var e = spawnEnemy(type, lane || 0, { hp: 1800, startDist: startDist || 0 });
    return e ? { eid: e.eid, hp: e.hp, x: e.x, y: e.y } : null;
  },
  setWave: function (n) {
    G.wave = Math.max(0, Math.min(12, n | 0));
    G.cleared = Math.max(0, G.wave - 1);
    G.phase = 'PREP'; G.gapMs = 0;
    G.queues = [];
    return G.wave;
  },
  getTowers: function () {
    return G.towers.map(function (t) {
      return { id: t.def.id, lv: t.lv + 1, x: t.site.x, y: t.site.y, rng: towerRng(t), invested: t.invested, site: t.site.idx,
        cdMs: Math.round(t.cdMs), lockMs: Math.round(t.lockMs), dmg: t.def.lv[t.lv].dmg,
        pen: t.def.lv[t.lv].pen || 0, splash: t.def.lv[t.lv].splash || 0,
        slow: t.def.lv[t.lv].slow || 0, dps: t.def.lv[t.lv].dps || 0 };
    });
  },
  getEnemies: function () {
    return G.enemies.map(function (e) {
      return { eid: e.eid, type: e.type, hp: e.hp, maxHp: e.maxHp, arm: e.arm, flying: e.isFlying,
        slow: Math.max(e.slowPct, e.mortarSlowPct), x: e.x, y: e.y, prog: e.prog, bounty: e.bountyZero ? 0 : e.bountyBase };
    });
  },
  dmgCalc: dmgCalc,
  save: function () { writeSave(); return JSON.parse(JSON.stringify(save)); },
  load: function () { loadSave(); applySettings(); recomputeTech(); bgDirty = true; return JSON.parse(JSON.stringify(save)); },
  reset: function () { resetSave(); applySettings(); recomputeTech(); bgDirty = true; return true; },
  /* 额外辅助（QA 便利，非必需） */
  addGold: function (n) { G.gold += n | 0; return G.gold; },
  setGold: function (n) { G.gold = n | 0; return G.gold; },
  damage: function (eid, amount, pen) {
    for (var i = 0; i < G.enemies.length; i++) {
      var e = G.enemies[i];
      if (e.eid === eid && e.alive) { var d = applyDamage(e, amount, pen || 0, 'debug'); return { dealt: d, hp: e.hp, alive: e.alive }; }
    }
    return null;
  },
  tick: function (ms) { simulate(ms); return { phase: G.phase, wave: G.wave, enemies: G.enemies.length, gold: G.gold, hp: G.baseHP }; },
  forceEndWave: function () { endWave(); return { wave: G.wave, gold: G.gold, hp: G.baseHP, phase: G.phase }; },
  sell: function (siteIdx) {
    if (!G.map || !G.map.sites[siteIdx] || !G.map.sites[siteIdx].tower) return null;
    var g0 = G.gold;
    sellTower(G.map.sites[siteIdx].tower);
    return { refund: G.gold - g0 };
  },
  mod: function () { return JSON.parse(JSON.stringify(MOD)); },
  ui: UI,
  build: function (siteIdx, type, lv) {
    if (!G.map || !G.map.sites[siteIdx]) return null;
    var site = G.map.sites[siteIdx];
    G.gold += 99999;
    if (!buildAtSite(site, type)) return null;
    var t = site.tower;
    for (var i = 1; i < (lv || 1); i++) upgradeTower(t);
    return { id: t.def.id, lv: t.lv + 1 };
  },
  towersData: TOWERS, enemiesData: ENEMIES, mapsData: MAPS, wavesData: WAVES, techData: TECH,
  setSpeed: function (n) { G.speed = Math.max(1, Math.min(3, n | 0)); G.paused = false; return G.speed; },
  pause: function (b) { G.paused = !!b; return G.paused; },
  /* 波间倒计时（QA：验证「暂停不计、倍速不缩放」） */
  setGap: function (ms) { G.gapMs = Math.max(0, Math.min(GAP_MS, ms || 0)); return G.gapMs; },
  gapInfo: function () {
    return { gapMs: Math.round(G.gapMs), remainSec: gapRemainSec(), bonus: gapRemainSec() * 2, phase: G.phase };
  },
  callNextWave: function () {
    var g0 = G.gold;
    callNextWave();
    return { bonus: G.gold - g0, wave: G.wave, phase: G.phase };
  },
  blindZones: function () {
    if (!G.map) return null;
    return G.map.blind.map(function (b) {
      var pm = G.map.lanes[b.lane], a = pathPoint(pm, b.s), z = pathPoint(pm, b.e);
      return { lane: b.lane, from: { x: a.x, y: a.y }, to: { x: z.x, y: z.y }, len: Math.round(b.e - b.s) };
    });
  },
  paths: function () {
    if (!G.map) return null;
    return G.map.lanes.map(function (l) { return { pts: l.pts, total: Math.round(l.total) }; });
  }
};

/* QA 快照入口（便于自动化截图，不影响正常游玩）
   例：index.html#play=M3&wave=6&towers=1   /   index.html#screen=tech        */
function applyHashEntry() {
  if (typeof window.location === 'undefined' || !window.location.hash) return;
  var h = String(window.location.hash).replace(/^#/, '');
  if (!h) return;
  var q = {}, parts = h.split('&'), i, kv;
  for (i = 0; i < parts.length; i++) {
    kv = parts[i].split('=');
    q[kv[0]] = kv[1] === undefined ? '1' : kv[1];
  }
  if (q.screen === 'tech') { G.state = 'TECH'; return; }
  if (q.screen === 'menu') { G.state = 'MENU'; return; }
  if (q.play && MAPS[q.play]) {
    var keepGold = save.tp;
    save.tp = Math.max(keepGold, 200);
    startGame(q.play);
    if (q.wave) {
      var w = Math.max(1, Math.min(12, parseInt(q.wave, 10) || 1));
      G.wave = w - 1; G.cleared = w - 1; G.phase = 'PREP'; G.gapMs = 0; G.queues = [];
    }
    if (q.towers) {
      G.gold = 99999;
      var types = ['A', 'B', 'C', 'D'];
      for (i = 0; i < G.map.sites.length; i++) {
        var site = G.map.sites[i];
        var ty = site.high ? 'D' : types[i % 4];
        if (buildAtSite(site, ty)) {
          var tp2 = parseInt(q.lv || '2', 10);
          for (var l = 1; l < tp2; l++) upgradeTower(site.tower);
        }
      }
      G.gold = q.gold ? parseInt(q.gold, 10) : 850;
    }
    if (q.spawn) {
      for (i = 0; i < 6; i++) spawnEnemy(i % 2 ? 'BULWARK' : 'GRUNT', 0, 200 + i * 90);
      for (i = 0; i < 4; i++) spawnEnemy('WASP', 0);
    }
    if (q.sel) { G.selSite = G.map.sites[parseInt(q.sel, 10) || 0]; G.selTower = G.selSite.tower; }
  }
}

/* ================================================================ 36. 启动 */
function boot() {
  loadSave();
  applySettings();
  recomputeTech();
  resize();
  buildHatch();
  G.settingsOpen = false;
  G.confirmReset = false;
  G.mapId = 'M1';
  G.state = 'MENU';
  applyHashEntry();
  var bootEl = document.getElementById('boot');
  if (bootEl) bootEl.className = 'hide';
  window.requestAnimationFrame(loop);
}
if (document.readyState === 'complete' || document.readyState === 'interactive') boot();
else document.addEventListener('DOMContentLoaded', boot);

})();
